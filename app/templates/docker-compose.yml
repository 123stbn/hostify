# ==============================================================================
# HOSTIFY: PERSONAL MUSIC CLOUD (SELF-HOSTED SPOTIFY ALTERNATIVE)
# ==============================================================================
# Turnkey self-hosted music streaming stack:
# - Streaming Core: Navidrome (OpenSubsonic API for Feishin & Symfonium)
# - Scrobbling & Metadata: Multi-Scrobbler + MusicBrainz -> ListenBrainz
# - Segmented Ingestion: Explo (Direct), Slskd (Soulseek), qBittorrent (Torrents)
# - Indexing: Prowlarr
# - Remote Access: Tailscale Sidecar (Optional) or Reverse Proxy
# - Appliance Web UI: Hostify Wizard & Dashboard (:3500)
# ==============================================================================

name: hostify

services:
  # ----------------------------------------------------------------------------
  # HOSTIFY APPLIANCE: SETUP WIZARD & MANAGEMENT DASHBOARD
  # ----------------------------------------------------------------------------
  hostify:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: hostify/appliance:latest
    container_name: hostify-appliance
    restart: unless-stopped
    ports:
      - "${HOSTIFY_PORT:-3500}:3500"
    environment:
      - NODE_ENV=production
      - HOSTIFY_PORT=3500
      - DOCKER_SOCK=/var/run/docker.sock
      - COMPOSE_PROJECT_DIR=/app/project
      - PUID=${PUID:-1000}
      - PGID=${PGID:-10}
      - TZ=${TZ:-America/Lima}
      - HOST_IP=${HOST_IP:-}
      - HOST_HOSTNAME=${HOST_HOSTNAME:-hostify}
      # HOST_HOME: exposes the real host home directory path to the wizard's
      # directory picker so it can browse /Users/… or /home/… on the host.
      - HOST_HOME=${HOME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app/project
      # Mount host home dir so the directory picker can browse AND the wizard
      # can create the music subfolder structure (personal/, explo/, slskd/, torrents/)
      - ${HOME}:${HOME}
      - ${MUSIC_ROOT:-/volume1/music}:/music
    networks:
      - hostify-net

  # ----------------------------------------------------------------------------
  # MDNS SIDECAR: AVAHI (BROADCASTS hostify.local ON LAN)
  # ----------------------------------------------------------------------------
  # Publishes hostname `hostify.local` (or ${HOST_HOSTNAME}.local) via mDNS/Bonjour
  # so LAN devices can connect without having to memorize local IP addresses.
  # Follows the standard pattern used by homeassistant.local:8123.
  #
  # Requires `network_mode: host` to broadcast multicast packets on the real network.
  # Compatible with macOS, Linux, and Windows (WSL2 / Docker Desktop host net mode).
  # ----------------------------------------------------------------------------
  avahi:
    image: flungo/avahi:latest
    container_name: hostify-avahi
    restart: unless-stopped
    network_mode: host
    environment:
      # Hostname announced on the LAN: hostify.local (or ${HOST_HOSTNAME}.local)
      - SERVER_HOST_NAME=${HOST_HOSTNAME:-hostify}
      - SERVER_DOMAIN_NAME=local
      - SERVER_ENABLE_DBUS=no
      - SERVER_USE_IPV4=yes
      - SERVER_USE_IPV6=no
      # Broadcast ONLY on the host network interface (prevent internal Docker bridge loops)
      - SERVER_ALLOW_INTERFACES=${AVAHI_IFACE:-eth0}
      - PUBLISH_PUBLISH_WORKSTATION=no
      - PUBLISH_PUBLISH_HINFO=no

  # ----------------------------------------------------------------------------
  # STREAMING CORE: NAVIDROME (OPEN SUBSONIC API)
  # ----------------------------------------------------------------------------
  navidrome:
    image: deluan/navidrome:latest
    container_name: hostify-navidrome
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-10}"
    # Fully isolated within hostify-net: all external access routes through Hostify Gateway (:3500)
    expose:
      - "4533"
    environment:
      - ND_SCANSCHEDULE=1m
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=48h
      - ND_BASEURL=${BASE_URL:-}
      - ND_ENABLETRANSCODINGCONFIG=true
      - ND_ENABLESHARING=true
      - ND_REVERSEPROXYUSERHEADER=${REVERSE_PROXY_USER_HEADER:-Remote-User}
      - ND_REVERSEPROXYWHITELIST=${REVERSE_PROXY_WHITELIST:-0.0.0.0/0}
    volumes:
      - ${DOCKER_DATA:-/volume1/docker}/navidrome/data:/data
      # Recursive ingestion: Navidrome reads all subfolders (personal, explo, slskd, torrents)
      - ${MUSIC_ROOT:-/volume1/music}:/music:ro
    networks:
      - hostify-net

  # ----------------------------------------------------------------------------
  # MODERN WEB PLAYER: FEISHIN (SPOTIFY-STYLE OPENSUBSONIC CLIENT)
  # ----------------------------------------------------------------------------
  feishin:
    image: ghcr.io/jeffvli/feishin:latest
    container_name: hostify-feishin
    restart: unless-stopped
    expose:
      - "9180"
    environment:
      - SERVER_NAME=Hostify
      - SERVER_TYPE=navidrome
      - SERVER_URL=${BASE_URL:-}
      - SERVER_LOCK=true
      - NAVIDROME_PORT=${NAVIDROME_PORT:-4533}
      - NAVIDROME_ADMIN_USER=${NAVIDROME_ADMIN_USER:-}
      - NAVIDROME_ADMIN_PASSWORD=${NAVIDROME_ADMIN_PASSWORD:-}
      - ANALYTICS_DISABLED=true
      - FS_GENERAL_THEME=defaultDark
    volumes:
      - ${DOCKER_DATA:-/volume1/docker}/feishin/settings.js.template:/etc/nginx/templates/settings.js.template:ro
    networks:
      - hostify-net

  # ----------------------------------------------------------------------------
  # SCROBBLING & METADATA ENRICHMENT LAYER
  # ----------------------------------------------------------------------------
  multi-scrobbler:
    image: foxxmd/multi-scrobbler:latest
    container_name: hostify-multi-scrobbler
    restart: unless-stopped
    expose:
      - "9078"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-10}
      - TZ=${TZ:-America/Lima}
      - BASE_URL=http://localhost:3500/tools/scrobbler
      # ListenBrainz - Client
      - LZ_USER=${LZ_USER:-}
      - LZ_TOKEN=${LZ_TOKEN:-}
      - LZ_ID=listenbrainz
      # Navidrome / Subsonic - Playback Source
      - SUBSONIC_ID=navidrome
      - SUBSONIC_NAME=Navidrome
      - SUBSONIC_URL=http://hostify-navidrome:${NAVIDROME_PORT:-4533}
      - SUBSONIC_USER=${NAVIDROME_ADMIN_USER:-}
      - SUBSONIC_PASSWORD=${NAVIDROME_ADMIN_PASSWORD:-}
      # MusicBrainz - Smart tag transformation
      - MB_PRESETS=default,sensible,native
    volumes:
      - ${DOCKER_DATA:-/volume1/docker}/multi-scrobbler/config:/config
    networks:
      - hostify-net

  # ----------------------------------------------------------------------------
  # INGESTION 1: DIRECT AUDIO DOWNLOADER & CURATOR (EXPLO)
  # ----------------------------------------------------------------------------
  explo:
    image: ghcr.io/lumepart/explo:latest
    container_name: hostify-explo
    restart: unless-stopped
    expose:
      - "7288"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-10}
      - TZ=${TZ:-America/Lima}
      - WEB_UI=true
      - WIZARD_COMPLETE=true
      # ListenBrainz integration for automated weekly discovery
      - DISCOVERY_SERVICE=listenbrainz
      - LISTENBRAINZ_USER=${LZ_USER:-}
      - LISTENBRAINZ_USER_TOKEN=${LZ_TOKEN:-}
      - LISTENBRAINZ_DISCOVERY=playlist
      - ENRICH_TRACK_METADATA=true
      # Navidrome (OpenSubsonic) integration
      - EXPLO_SYSTEM=subsonic
      - SYSTEM_URL=http://hostify-navidrome:${NAVIDROME_PORT:-4533}
      - SYSTEM_USERNAME=${NAVIDROME_ADMIN_USER:-}
      - SYSTEM_PASSWORD=${NAVIDROME_ADMIN_PASSWORD:-}
      # Automated Discovery Playlist Schedules (Zero-Config)
      - WEEKLY_EXPLORATION_SCHEDULE=15 00 * * 2
      - WEEKLY_EXPLORATION_FLAGS=--playlist weekly-exploration
      - WEEKLY_JAMS_SCHEDULE=30 00 * * 1
      - WEEKLY_JAMS_FLAGS=--playlist weekly-jams
      - DAILY_JAMS_SCHEDULE=15 01 * * *
      - DAILY_JAMS_FLAGS=--playlist daily-jams
      - ON_REPEAT_SCHEDULE=00 12 1 * *
      - ON_REPEAT_FLAGS=--playlist on-repeat
      # Download service chain in order of priority (Hi-Fi / Lossless)
      - DOWNLOAD_SERVICES=slskd,lidarr
      # SLSKD (Soulseek P2P) integration
      - SLSKD_URL=http://hostify-slskd:5030
      - SLSKD_API_KEY=${SLSKD_API_KEY:-hostify_secret_key}
      # Lidarr (*arr) integration
      - LIDARR_URL=http://hostify-lidarr:8686
      - LIDARR_API_KEY=${LIDARR_API_KEY:-}
      - WEB_ENV_PATH=/opt/explo/config/.env
    volumes:
      - ${DOCKER_DATA:-/volume1/docker}/explo/config:/opt/explo/config
      - ${MUSIC_ROOT:-/volume1/music}/explo:/data
    networks:
      - hostify-net

  # ----------------------------------------------------------------------------
  # INGESTION 2: SOULSEEK P2P NETWORK (SLSKD)
  # ----------------------------------------------------------------------------
  slskd:
    image: slskd/slskd:latest
    container_name: hostify-slskd
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-10}"
    # Web UI isolated to hostify-net; peer transfer port remains open for P2P network traffic
    expose:
      - "5030"
      - "5031"
    ports:
      - "50300:50300"
    environment:
      # Disable Web UI login for direct access from Hostify dashboard
      - SLSKD_NO_AUTH=true
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_URL_BASE=/tools/slskd
      - SLSKD_SLSK_USERNAME=${SLSKD_USERNAME:-hostify_user}
      - SLSKD_SLSK_PASSWORD=${SLSKD_PASSWORD:-hostify_pass}
      - SLSKD_API_KEY=${SLSKD_API_KEY:-hostify_secret_key}
      - SLSKD_DOWNLOADS_DIR=/downloads
    volumes:
      - ${DOCKER_DATA:-/volume1/docker}/slskd:/app
      - ${MUSIC_ROOT:-/volume1/music}/slskd:/downloads
    networks:
      - hostify-net

  # ----------------------------------------------------------------------------
  # INGESTION 3: BITTORRENT (QBITTORRENT) WITH BUFFER SEGREGATION
  # ----------------------------------------------------------------------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: hostify-qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-10}
      - TZ=${TZ:-America/Lima}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    # Web UI isolated to hostify-net; torrenting transfer ports remain open for peer transfers
    expose:
      - "8080"
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ${DOCKER_DATA:-/volume1/docker}/qbittorrent/config:/config
      # Incomplete files buffer (Navidrome scanner ignores this folder):
      - ${DOCKER_DATA:-/volume1/docker}/qbittorrent/incomplete:/downloads/incomplete
      # Completed files (Navidrome indexes immediately):
      - ${MUSIC_ROOT:-/volume1/music}/torrents:/downloads/completed
    networks:
      - hostify-net

  # ----------------------------------------------------------------------------
  # TORRENT INDEXER & SEARCH: PROWLARR
  # ----------------------------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: hostify-prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-10}
      - TZ=${TZ:-America/Lima}
      - PROWLARR__SERVER__URLBASE=/tools/prowlarr
      - PROWLARR__AUTH__METHOD=Forms
      - PROWLARR__AUTH__REQUIRED=DisabledForLocalAddresses
    expose:
      - "9696"
    volumes:
      - ${DOCKER_DATA:-/volume1/docker}/prowlarr:/config
    networks:
      - hostify-net

  # ----------------------------------------------------------------------------
  # MUSIC MANAGEMENT & AUTOMATION (*ARR): LIDARR
  # ----------------------------------------------------------------------------
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: hostify-lidarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-10}
      - TZ=${TZ:-America/Lima}
      - LIDARR__SERVER__URLBASE=/tools/lidarr
      - LIDARR__AUTH__METHOD=Forms
      - LIDARR__AUTH__REQUIRED=DisabledForLocalAddresses
    expose:
      - "8686"
    volumes:
      - ${DOCKER_DATA:-/volume1/docker}/lidarr:/config
      - ${MUSIC_ROOT:-/volume1/music}:/music
      - ${MUSIC_ROOT:-/volume1/music}/torrents:/downloads/completed
    networks:
      - hostify-net

networks:
  hostify-net:
    name: hostify-net
    driver: bridge
