# ==============================================================================
# HOSTIFY APPLIANCE - OFFICIAL DEPLOYMENT (PORTAINER / NAS / DOCKER COMPOSE)
# ==============================================================================
# Single-step deployment using the official pre-built image.
# Does not require cloning the Git repository or compiling with Node.js.
#
# Web Dashboard: http://<SERVER-OR-NAS-IP>:3500 (or http://hostify.local:3500)
# ==============================================================================
version: '3.8'

services:
  hostify:
    image: ghcr.io/123stbn/hostify/appliance:latest
    container_name: hostify-appliance
    restart: unless-stopped
    ports:
      - "${HOSTIFY_PORT:-3500}:3500"
    environment:
      - NODE_ENV=production
      - HOSTIFY_PORT=3500
      - DOCKER_SOCK=/var/run/docker.sock
      - COMPOSE_PROJECT_DIR=/app/project
      - PUID=${PUID:-1000}
      - PGID=${PGID:-10}
      - TZ=${TZ:-America/Lima}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Stores the wizard-generated .env file and stack configurations
      - ${DOCKER_DATA:-/volume1/docker/hostify}/project:/app/project
      - ${MUSIC_ROOT:-/volume1/music}:/music
      - ${DOCKER_DATA:-/volume1/docker/hostify}:${DOCKER_DATA:-/volume1/docker/hostify}

  # LAN mDNS discovery broadcaster: enables http://hostify.local:3500 without manual IP
  avahi:
    image: flungo/avahi:latest
    container_name: hostify-avahi
    restart: unless-stopped
    network_mode: host
    environment:
      SERVER_HOST_NAME: ${HOST_HOSTNAME:-hostify}
      SERVER_DOMAIN_NAME: local
      SERVER_USE_IPV4: "yes"
      SERVER_USE_IPV6: "no"
      SERVER_ENABLE_DBUS: "no"
      SERVER_ALLOW_INTERFACES: ${AVAHI_IFACE:-eth0}
      PUBLISH_PUBLISH_WORKSTATION: "no"


